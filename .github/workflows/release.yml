name: Release

# Push a tag like v0.2.0 to build MelvorBot.exe on Windows and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Build
        run: python tools/build.py ${{ github.ref_name }}
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/MelvorBot-*.zip --title "Melvor Bot ${{ github.ref_name }}" --generate-notes
